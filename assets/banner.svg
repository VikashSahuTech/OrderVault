<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 380" width="1280" height="380" role="img" aria-labelledby="t d">
  <title id="t">OrderVault</title>
  <desc id="d">OrderVault: every online order in one private place. Amazon, Flipkart and Myntra. No server, no tracking.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#171040"/>
      <stop offset="1" stop-color="#2a1a7a"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c9bfff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7258f5" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7258f5" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="380" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="380" rx="28" fill="url(#grid)"/>
  <circle cx="1020" cy="190" r="300" fill="url(#glow)"/>

  <!-- logo -->
  <g transform="translate(96 82)">
    <rect width="132" height="132" rx="37" fill="#7258f5"/>
    <g transform="scale(2.0625)">
      <path d="M15 23 32 13l17 10v19L32 52 15 42z" fill="none" stroke="#fff" stroke-width="4" stroke-linejoin="round"/>
      <path d="M24 32h16M32 24v16" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
    </g>
  </g>

  <!-- text -->
  <text x="268" y="162" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="84" font-weight="800" fill="url(#title)" letter-spacing="-1.5">OrderVault</text>
  <text x="270" y="214" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="500" fill="#d8d2ff">Every online order. One private place.</text>

  <!-- chips -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="600" fill="#ffffff">
    <rect x="96" y="276" width="150" height="44" rx="22" fill="#ffffff" fill-opacity="0.10" stroke="#ffffff" stroke-opacity="0.22"/>
    <text x="171" y="305" text-anchor="middle">Amazon</text>
    <rect x="260" y="276" width="150" height="44" rx="22" fill="#ffffff" fill-opacity="0.10" stroke="#ffffff" stroke-opacity="0.22"/>
    <text x="335" y="305" text-anchor="middle">Flipkart</text>
    <rect x="424" y="276" width="150" height="44" rx="22" fill="#ffffff" fill-opacity="0.10" stroke="#ffffff" stroke-opacity="0.22"/>
    <text x="499" y="305" text-anchor="middle">Myntra</text>
    <rect x="598" y="276" width="262" height="44" rx="22" fill="#7258f5" fill-opacity="0.35" stroke="#a899ff" stroke-opacity="0.6"/>
    <text x="729" y="305" text-anchor="middle">No server. No tracking.</text>
  </g>

  <!-- decorative vault -->
  <g transform="translate(930 70)" opacity="0.95">
    <circle cx="120" cy="120" r="112" fill="#0b1020" fill-opacity="0.55" stroke="#a899ff" stroke-opacity="0.45" stroke-width="3"/>
    <circle cx="120" cy="120" r="84" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2" stroke-dasharray="3 9" stroke-linecap="round"/>
    <g transform="translate(40 40) scale(2.5)">
      <path d="M15 23 32 13l17 10v19L32 52 15 42z" fill="#7258f5" fill-opacity="0.35" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>
      <path d="M24 32h16M32 24v16" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>
</svg>
