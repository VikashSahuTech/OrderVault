name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'ordervault-pwa/**'
      - '.github/workflows/deploy-pwa.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ordervault-pwa
    steps:
:
